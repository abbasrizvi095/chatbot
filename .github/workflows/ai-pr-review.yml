name: AI PR Review (Local LLaMA)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull llama3.1:8b

      - name: Generate AI PR Review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 30
            });

            let diff = "";
            for (const file of files.data) {
              if (file.patch) {
                diff += `\n--- ${file.filename} ---\n${file.patch}\n`;
              }
            }

            if (!diff.trim()) {
              diff = "No code changes detected.";
            }

            // Limit size to avoid token explosion
            diff = diff.slice(0, 12000);

            const { execSync } = require("child_process");

            const prompt = `
            You are a senior software engineer performing a pull request review.

            Review the following code changes and provide:
            1. A concise summary of what changed
            2. Specific technical concerns (if any)
            3. Potential bugs or edge cases
            4. Suggested improvements

            Avoid generic advice. Reference the actual code.

            CODE DIFF:
            ${diff}
            `;

            let reviewOutput = "AI review failed.";

            try {
              reviewOutput = execSync(
                `echo ${JSON.stringify(prompt)} | ollama run llama3.1:8b`,
                { maxBuffer: 1024 * 1024 }
              ).toString();
            } catch (err) {
              reviewOutput = err.toString();
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `
              ### 🤖 AI-assisted PR Review (LLaMA 3.1)

              ${reviewOutput}

              ---
              _Assistive only. Human approval required._
              `
            });

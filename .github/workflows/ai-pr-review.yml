name: AI PR Review (Local LLaMA)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull llama3.1:8b

      - name: Generate AI PR Review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 30
            });

            let diff = "";
            for (const file of files.data) {
              if (file.patch) {
                diff += `\n--- ${file.filename} ---\n${file.patch}\n`;
              }
            }

            diff = diff.slice(0, 12000) || "No code changes detected.";

            const { execSync } = require("child_process");

            const prompt = `
            You are a senior software engineer reviewing a pull request.

            Provide:
            1. Summary of changes
            2. Technical concerns
            3. Bugs or edge cases
            4. Suggested improvements

            Be specific to the code.

            CODE DIFF:
            ${diff}
            `;

            const review = execSync(
              `echo ${JSON.stringify(prompt)} | ollama run llama3.1:8b`,
              { maxBuffer: 1024 * 1024 }
            ).toString();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `
              ### 🤖 AI-assisted PR Review (LLaMA 3.1)

              ${review}

              ---
              _Assistive only. Human approval required._
              `
            });

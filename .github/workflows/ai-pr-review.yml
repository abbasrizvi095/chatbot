name: AI PR Review (Diff-aware)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR diff
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            let diffText = "";
            for (const file of files.data) {
              if (file.patch) {
                diffText += `\n--- ${file.filename} ---\n${file.patch}\n`;
              }
            }

            // Safety: limit diff size
            diffText = diffText.slice(0, 12000);

            const prompt = `
            You are a senior engineer performing a PR review.

            Review the following code changes and provide:
            1. Summary of what changed
            2. Key technical concerns
            3. Potential bugs or edge cases
            4. Suggestions for improvement

            Be specific to the code. Avoid generic advice.

            CODE DIFF:
            ${diffText}
            `;

            const response = await fetch(
              "https://models.inference.ai.azure.com/chat/completions",
              {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "meta-llama/Meta-Llama-3.1-8B-Instruct",
                  messages: [
                    { role: "system", content: "You are a strict code reviewer." },
                    { role: "user", content: prompt }
                  ],
                  temperature: 0.1
                })
              }
            );

            const data = await response.json();
            const review = data.choices?.[0]?.message?.content || "AI review unavailable.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `
              ### 🤖 AI-assisted PR Review

              ${review}

              ---
              _This review is assistive only. Human approval required._
              `
            });

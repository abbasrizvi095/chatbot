name: AI PR Review (Free LLaMA)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AI PR Review using GitHub Models (LLaMA 3.1)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const prompt = `
            You are a senior software engineer reviewing a pull request.

            Provide:
            1. A short summary of the change
            2. Key technical areas to review
            3. Potential risks or edge cases
            4. Suggested review checklist

            Keep it concise and professional.
            `;

            const response = await fetch(
              "https://models.inference.ai.azure.com/chat/completions",
              {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "meta-llama/Meta-Llama-3.1-8B-Instruct",
                  messages: [
                    { role: "system", content: "You are a PR review assistant." },
                    { role: "user", content: prompt }
                  ],
                  temperature: 0.2
                })
              }
            );

            const data = await response.json();
            const review = data.choices?.[0]?.message?.content || "AI review unavailable.";

            const body = `
            ### 🤖 Automated PR Review (AI-assisted)

            ${review}

            ---
            _This review is assistive only. Final approval remains with human reviewers._
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });

name: AI PR Review (Local LLaMA 3.1)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in {1..10}; do
            if ollama list >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            sleep 2
          done

      - name: Pull LLaMA model
        run: |
          ollama pull llama3.1:8b

      - name: Prepare PR diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run AI review
        run: |
          cat << 'EOF' > prompt.txt
          You are a senior software engineer performing a pull request review.

          Provide:
          1. Summary of changes
          2. Key technical concerns
          3. Potential bugs or edge cases
          4. Suggested improvements

          Be specific to the code. Avoid generic advice.

          CODE DIFF:
          EOF

          head -c 12000 pr.diff >> prompt.txt
          OLLAMA_NO_PROGRESS=1 ollama run llama3.1:8b < prompt.txt > review.txt

      - name: Post PR review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const review = fs.readFileSync("review.txt", "utf8");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                "### 🤖 AI-assisted PR Review (LLaMA 3.1)",
                "",
                review,
                "",
                "_Assistive only. Human approval required._"
              ].join("\n")
            });

